[project]
name = "recipe-agents"
version = "0.1.0"
description = "Sequential LangChain recipe agents with Azure Monitor tracing"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic-settings>=2.8,<3",
    "azure-cosmos>=4.9,<5",
    "azure-identity>=1.21,<2",
    "aiohttp>=3.11,<4",
    "langchain>=1,<2",
    "langchain-openai>=1,<2",
    "microsoft-opentelemetry",
    "opentelemetry-instrumentation-fastapi",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
    "ty>=0.0.1",
]

[[tool.uv.index]]
name = "microsoft"
url = "https://packagefeedproxy.microsoft.io/pypi/simple"
default = true

[tool.uv]
constraint-dependencies = ["jiter<0.18"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
